<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VOACAP Area Coverage Result</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { max-width: 900px; }
  #map { height: 520px; width: 100%; border: 1px solid #ccc; border-radius: 6px; margin-top: 1rem; }
  .controls { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.75rem; }
  select { padding: 0.3rem; font-size: 0.95rem; }
  .legend { display: flex; gap: 1rem; margin-top: 0.75rem; font-size: 0.85rem; }
  .swatch { display: inline-block; width: 0.9rem; height: 0.9rem; border-radius: 2px; vertical-align: middle; margin-right: 0.3rem; }
</style>
</head>
<body>
<h1>{{ label }} coverage &mdash; {{ center_lat }}, {{ center_lon }}</h1>

<div class="controls">
  <label for="freq-select">Frequency:</label>
  <select id="freq-select">
    {% for f in frequencies_mhz %}<option value="{{ f }}">{{ f }} MHz</option>{% endfor %}
  </select>
</div>

<div id="map"></div>

<div class="legend">
  <span><span class="swatch" style="background:#2ecc71"></span>Reliability &ge; 75%</span>
  <span><span class="swatch" style="background:#f1c40f"></span>30&ndash;75%</span>
  <span><span class="swatch" style="background:#e74c3c"></span>&lt; 30%</span>
</div>

<div class="back-actions">
  <form method="get" action="/area">
    {% for key, value in submitted.items() %}
    <input type="hidden" name="{{ key }}" value="{{ value }}">
    {% endfor %}
    <button type="submit" class="link-button">&larr; Edit inputs</button>
  </form>
  <a class="back" href="/area">Start a new area prediction</a>
</div>

<script>
  // grids: { "<freq_mhz>": [[lat, lon, reliability], ...], ... } - one
  // voacapl area-mode run per frequency (see area_deck.py for why).
  const grids = {{ grids_json | safe }};

  function reliabilityColor(rel) {
    if (rel >= 0.75) return "#2ecc71";
    if (rel >= 0.30) return "#f1c40f";
    return "#e74c3c";
  }

  const map = L.map('map').setView([{{ center_lat }}, {{ center_lon }}], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 12,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  L.marker([{{ center_lat }}, {{ center_lon }}]).addTo(map).bindPopup("{{ label }} (transmitter)");

  let currentLayer = null;

  function drawGrid(freqKey) {
    if (currentLayer) {
      map.removeLayer(currentLayer);
    }
    const points = grids[freqKey] || [];
    currentLayer = L.layerGroup(
      points.map(([lat, lon, rel]) =>
        L.circleMarker([lat, lon], {
          radius: 6,
          color: reliabilityColor(rel),
          fillColor: reliabilityColor(rel),
          fillOpacity: 0.8,
          weight: 0,
        }).bindTooltip(`${(rel * 100).toFixed(0)}% reliability`)
      )
    ).addTo(map);
  }

  const select = document.getElementById('freq-select');
  drawGrid(select.value);
  select.addEventListener('change', () => drawGrid(select.value));
</script>
</body>
</html>
